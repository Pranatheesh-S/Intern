<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4K Town Map Preview</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    .card {
      max-width: 1200px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 24px;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>4K Town Map Preview (16:9 Aspect Ratio)</h1>
    <img src="/FunWithMagnets/town_map_4k.jpg" alt="4K Town Map" />
  </div>
</body>
</html>
